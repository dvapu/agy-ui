<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Mascot A — kiểm thử trực quan</title>
<style>
  html, body { margin: 0; height: 100%; background: #07202a; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; }
  .o { position: absolute; border: 1px dashed rgba(63,207,210,.35); font: 11px system-ui; color: #7fb4c2; padding: 4px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>
<script type="module">
import { MascotA } from "../src/renderer/mascot-a.js";

const cv = document.getElementById("c");
const mv = new MascotA(cv, null, { anh: "../assets/agy-a.png", co: 240, le: 40, hitEl: null });
mv.batDau();
mv.thucDay();
window.__mv = mv;

// Các ô khoanh vị trí để đối chiếu
const nhan = document.createElement("div");
nhan.className = "o";
nhan.style.cssText += "left:8px;top:8px;width:auto;height:auto";
nhan.textContent = "Mascot co=240px — rê chuột để mắt nhìn theo, bấm để nhảy";
document.body.appendChild(nhan);
</script>
</body>
</html>
